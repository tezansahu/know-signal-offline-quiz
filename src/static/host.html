<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Signal · Host</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { height: 100vh; overflow: hidden; font-size: clamp(13px, 1.1vw, 24px); }
  #app { position: fixed; inset: 0; padding: 5.2em 3vw 5.6em; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fade .35s both; }
  h1, h2, h3, p { margin: 0; }

  /* chrome */
  #chrome { position: fixed; top: 0; left: 0; right: 0; height: 4.6em; padding: 0 3vw; display: flex; align-items: center; gap: 1.2em; z-index: 20; }
  #chrome .logo { font-size: 1.55em; }
  #crumb { color: var(--muted); font-weight: 700; font-stretch: 112%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 1.2em; border-left: 1.5px solid var(--line); }
  #crumb:empty { display: none; }
  #roomchip { margin-left: auto; display: flex; align-items: center; gap: .55em; font-weight: 800; font-stretch: 112%; font-size: .9em; padding: .45em .9em; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  #roomchip:empty { display: none; }
  .dot { width: .55em; height: .55em; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: live 2s infinite; }
  .dot.off { background: var(--bad); animation: none; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 .6em transparent; } }

  #dock { position: fixed; right: 3vw; bottom: 1.4em; display: flex; gap: .6em; align-items: center; z-index: 20; }
  .icon { width: 2.7em; height: 2.7em; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); transition: background .15s; }
  .icon:hover { background: var(--surface-2); }
  .icon svg { width: 1.15em; height: 1.15em; }
  #next { font-size: 1.1em; padding: .8em 1.5em; }
  #next kbd { margin-left: .2em; }
  #hints { position: fixed; left: 3vw; bottom: 1.9em; color: var(--muted); font-size: .78em; display: flex; gap: 1.2em; align-items: center; z-index: 5; }
  #hints span { display: inline-flex; gap: .4em; align-items: center; }

  /* ---------- setup ---------- */
  .setup { display: grid; grid-template-columns: 1.35fr 1fr; gap: 3vw; flex: 1; min-height: 0; align-items: start; }
  .hero h1 { font-size: 4.6em; margin: .15em 0 .25em; }
  .hero .sub { color: var(--muted); font-size: 1.2em; max-width: 30em; line-height: 1.45; margin-bottom: 1.6em; text-wrap: balance; }
  .quiz-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: 1em; max-height: 46vh; overflow: auto; padding: 4px; }
  .quiz-card { position: relative; text-align: left; padding: 1.2em 1.3em 1.1em; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); transition: transform .18s var(--ease), border-color .18s, box-shadow .18s; min-height: 8.2em; display: flex; flex-direction: column; }
  .quiz-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .quiz-card.sel { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
  .quiz-card b { font-size: 1.2em; font-stretch: 112%; font-weight: 800; line-height: 1.2; }
  .quiz-card .meta { margin-top: auto; padding-top: .9em; display: flex; justify-content: space-between; align-items: flex-end; color: var(--muted); font-weight: 600; }
  .quiz-card .logo { font-size: 1.3em; opacity: .9; }
  .quiz-card .tick { position: absolute; top: .9em; right: .9em; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--brand); color: #fff; display: none; place-items: center; font-size: .8em; font-weight: 900; }
  .quiz-card.sel .tick { display: grid; }
  .newq { margin-top: 1em; }
  .herobtns { display: flex; gap: .6em; margin-top: 1em; flex-wrap: wrap; }
  .hshead { display: flex; align-items: center; justify-content: space-between; }
  .hspill { display: inline-flex; align-items: center; gap: .45em; font-size: .85em; font-weight: 800; font-stretch: 112%; padding: .35em .8em; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .hspill.on { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .hspill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .panel { padding: 1.5em 1.6em; display: flex; flex-direction: column; gap: .9em; box-shadow: var(--shadow); }
  .panel h3 { font-size: 1.15em; font-stretch: 112%; font-weight: 900; }
  .switch { display: flex; align-items: flex-start; gap: .9em; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch i { width: 2.9em; height: 1.65em; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; margin-top: .1em; }
  .switch i::after { content: ""; position: absolute; top: .22em; left: .22em; width: 1.2em; height: 1.2em; border-radius: 50%; background: #fff; transition: transform .25s var(--spring); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + i { background: var(--brand); }
  .switch input:checked + i::after { transform: translateX(1.25em); }
  .switch b { font-weight: 800; }
  .hint { color: var(--muted); font-size: .88em; line-height: 1.45; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; }
  .sep { height: 1px; background: var(--line); }
  .warn { background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); color: var(--text); padding: .75em 1em; border-radius: 12px; font-size: .9em; }
  .ok { color: var(--good); font-weight: 700; }
  #open { font-size: 1.15em; padding: .95em; }

  /* ---------- lobby ---------- */
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 3vw; flex: 1; min-height: 0; }
  .joinpanel { padding: 1.6em 1.8em; display: flex; flex-direction: column; gap: 1.2em; box-shadow: var(--shadow); align-self: start; }
  .qrs { display: flex; gap: 1.4em; }
  .step { display: flex; flex-direction: column; gap: .7em; width: 19vw; }
  .step .lab { display: flex; align-items: center; gap: .6em; font-weight: 800; font-stretch: 112%; }
  .step .n { width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: .85em; font-weight: 900; }
  .qr { background: #fff; border-radius: 16px; padding: .7vw; aspect-ratio: 1; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr.missing { background: transparent; border: 2px dashed var(--line); color: var(--muted); display: grid; place-items: center; text-align: center; padding: 1.4em; font-size: .9em; line-height: 1.45; }
  .step .cap { color: var(--muted); font-size: .9em; }
  .step .cap b { color: var(--text); }
  .typeurl { display: flex; flex-direction: column; gap: .3em; padding-top: 1em; border-top: 1.5px dashed var(--line); }
  .typeurl .display { font-size: 2.5em; letter-spacing: -0.01em; }
  .room { display: flex; flex-direction: column; min-height: 0; }
  .room h1 { font-size: 3.6em; margin: .2em 0 .5em; line-height: 1; }
  .meter { display: flex; align-items: flex-end; gap: 1.4em; margin-bottom: 1.4em; }
  .bars { display: flex; align-items: flex-end; gap: .35em; height: 5.2em; }
  .bars i { width: 1.05em; border-radius: .3em; background: var(--surface-2); border: 1px solid var(--line); transition: background .5s, transform .5s var(--spring); transform-origin: bottom; }
  .bars i:nth-child(1) { height: 36%; } .bars i:nth-child(2) { height: 58%; } .bars i:nth-child(3) { height: 80%; } .bars i:nth-child(4) { height: 100%; }
  .bars i.on:nth-child(1) { background: var(--a0); border-color: transparent; } .bars i.on:nth-child(2) { background: var(--a1); border-color: transparent; }
  .bars i.on:nth-child(3) { background: var(--a2); border-color: transparent; } .bars i.on:nth-child(4) { background: var(--a3); border-color: transparent; }
  .bars i.bump { animation: pulse .4s var(--spring); }
  .count { font-size: 5.4em; line-height: .8; }
  .meter .lbl { display: flex; flex-direction: column; gap: .25em; padding-bottom: .2em; }
  .meter .lbl b { font-size: 1.35em; font-stretch: 112%; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: .55em; align-content: flex-start; overflow: hidden; flex: 1; mask-image: linear-gradient(#000 80%, transparent); }
  .chip { background: var(--surface); border: 1.5px solid var(--line); padding: .45em 1em; border-radius: 999px; font-weight: 700; animation: pop-in .4s var(--spring) both; cursor: pointer; display: inline-flex; align-items: center; gap: .5em; }
  .chip::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: var(--c, var(--a1)); }
  .chip:hover { border-color: var(--bad); text-decoration: line-through; }

  /* ---------- question ---------- */
  .qtop { display: flex; align-items: center; gap: 1.2em; }
  .pips { display: flex; gap: .35em; }
  .pips i { width: 1.6em; height: .38em; border-radius: 99px; background: var(--line); }
  .pips i.done { background: var(--muted); } .pips i.cur { background: var(--brand); }
  .locked { margin-left: auto; font-weight: 700; color: var(--muted); display: flex; gap: .45em; align-items: baseline; }
  .locked b { font-size: 1.8em; color: var(--text); font-stretch: 125%; font-weight: 900; }
  .timerbar { height: .55em; background: var(--surface-2); border-radius: 99px; margin: 1em 0 0; overflow: hidden; }
  .timerbar div { height: 100%; width: 100%; background: var(--brand); border-radius: 99px; transform-origin: left; transition: background .3s; }
  .timerbar.low div { background: var(--bad); }
  .qbody { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 3vw; min-height: 0; }
  .qtext { font-size: 3.3em; font-weight: 800; font-stretch: 108%; line-height: 1.12; letter-spacing: -0.02em; max-width: 24em; }
  .clock { font-size: 7em; width: 1.6em; text-align: right; line-height: .8; }
  .clock.low { color: var(--bad); animation: pulse .5s ease-in-out infinite; }
  .ready .clock { color: var(--pop); }
  .ready .clock span { display: inline-block; animation: slam .6s var(--spring) both; }
  .readylab { color: var(--pop); }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 1vw; }
  .opt { background: var(--c); color: #fff; border-radius: var(--radius); padding: 1em 1.3em; font-size: 1.6em; font-weight: 800; font-stretch: 104%; display: flex; align-items: center; gap: .9em; min-height: 4.4em; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); animation: rise .45s var(--ease) both; }
  .opt .badge { font-size: .8em; }
  .ready .opt { visibility: hidden; animation: none; }

  /* ---------- reveal ---------- */
  .qsmall { font-size: 2.1em; font-weight: 800; font-stretch: 108%; margin: .7em 0 0; line-height: 1.18; max-width: 34em; }
  .chart { flex: 1; display: grid; gap: 1.6vw; align-items: end; padding: 1.2em 3vw 0; min-height: 0; }
  .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: .55em; transition: opacity .6s .4s; }
  .col .n { text-align: center; font-size: 2.6em; }
  .col .bar { background: var(--c); border-radius: 16px 16px 6px 6px; height: 6px; transition: height 1.1s var(--ease); }
  .col .lab { background: var(--c); color: #fff; border-radius: 14px; padding: .75em .9em; font-weight: 800; display: flex; gap: .7em; align-items: center; min-height: 3.6em; }
  .col .lab .badge { font-size: .7em; }
  .col.dim { opacity: .3; filter: grayscale(.9); }
  .col.correct .bar { box-shadow: 0 0 40px color-mix(in srgb, var(--c) 60%, transparent); }
  .col.correct .lab { outline: 4px solid var(--text); outline-offset: 4px; }
  .col .ck { margin-left: auto; font-size: 1.3em; }
  .callouts { display: flex; gap: .8em; justify-content: center; margin-top: 1.3em; min-height: 2.6em; }
  .pill { display: inline-flex; align-items: center; gap: .55em; padding: .55em 1.1em; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-stretch: 112%; animation: rise .5s var(--ease) both; }
  .pill.pop { background: var(--pop); color: #fff; border-color: transparent; }
  .pill .num { font-weight: 600; opacity: .85; }

  /* ---------- leaderboard ---------- */
  .lbhead { display: flex; align-items: baseline; gap: .8em; justify-content: center; margin: .2em 0 1em; }
  .lbhead h2 { font-size: 3.2em; }
  .lb { position: relative; width: min(66vw, 1150px); margin: 0 auto; }
  .lb-row { position: absolute; top: 0; left: 0; right: 0; height: 3.5em; display: flex; align-items: center; gap: 1em; padding: 0 1.4em 0 .6em; background: var(--surface); border-radius: 14px; border: 1.5px solid var(--line); transition: transform 1.25s cubic-bezier(.45,0,.2,1), opacity .6s, background .6s, border-color .6s; font-size: 1.15em; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .lb-row .r { width: 2.1em; height: 2.1em; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-stretch: 125%; background: var(--surface-2); }
  .lb-row .nm { flex: 1; display: flex; align-items: baseline; gap: .7em; min-width: 0; }
  .lb-row .nmt { font-weight: 800; font-stretch: 108%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .fast { font-size: .62em; color: var(--pop); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .4s; }
  .lb-row .gain { color: var(--good); font-weight: 800; font-size: .9em; opacity: 0; transform: scale(.6); transition: opacity .3s, transform .45s var(--spring); }
  .lb-row.counting .gain, .lb-row.counting .fast { opacity: 1; transform: none; }
  .lb-row .delta { width: 2.6em; font-size: .8em; font-weight: 800; text-align: center; opacity: 0; transition: opacity .4s .9s; }
  .lb-row .delta.up { color: var(--good); } .lb-row .delta.down { color: var(--muted); }
  .lb-row.moved .delta { opacity: 1; }
  .lb-row .sc { font-weight: 900; font-stretch: 112%; min-width: 4.6em; text-align: right; }
  .lb-row.top1 { background: var(--brand); color: #fff; border-color: transparent; }
  .lb-row.top1 .r { background: rgba(255,255,255,.18); }
  .lb-row.top1 .gain, .lb-row.top1 .delta.up { color: #fff; }
  .lb-row.top1 .fast { color: #ffd3e6; }
  .empty { text-align: center; color: var(--muted); margin-top: 3em; }

  /* ---------- podium ---------- */
  .final { align-items: center; text-align: center; }
  .final h1 { font-size: 3.4em; margin-top: .15em; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 1.6vw; flex: 1; width: 100%; min-height: 0; padding-top: .5em; position: relative; }
  .pod { width: 17vw; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(50px); transition: opacity .6s, transform .9s var(--spring); position: relative; }
  .pod.show { opacity: 1; transform: none; }
  .pod::before { content: ""; position: absolute; bottom: 30%; left: 50%; width: 140%; height: 140vh; transform: translateX(-50%); background: linear-gradient(to top, color-mix(in srgb, var(--pc) 22%, transparent), transparent 60%); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); opacity: 0; transition: opacity 1s .3s; pointer-events: none; z-index: -1; }
  .pod.show::before { opacity: 1; }
  .pod .who { font-size: 1.7em; font-weight: 900; font-stretch: 112%; margin-bottom: .2em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .pts { color: var(--muted); margin-bottom: .7em; font-weight: 700; }
  .pod .block { width: 100%; border-radius: 18px 18px 0 0; display: grid; place-items: start center; padding-top: .35em; font-size: 4em; color: rgba(255,255,255,.95); background: var(--pc); box-shadow: inset 0 -12px 0 rgba(0,0,0,.15); }
  .p1 { --pc: var(--brand); } .p2 { --pc: var(--a1); } .p3 { --pc: var(--a0); }
  .p1 .block { height: 40vh; } .p2 .block { height: 29vh; } .p3 .block { height: 21vh; }
  .p1 .who { font-size: 2.2em; }
  .crown { font-size: 2.2em; margin-bottom: .1em; animation: pop-in .6s var(--spring) both; }
  .rest { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; margin: 1em 0 .2em; max-width: 62vw; }
  .rest span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .35em .9em; font-weight: 700; color: var(--muted); }
  .rest b { color: var(--text); }
  .exports { position: fixed; left: 3vw; bottom: 1.3em; display: flex; gap: .6em; z-index: 21; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
</style>
</head>
<body>
<header id="chrome"><a class="logo" href="/host" id="brand"></a><span id="crumb"></span><span id="roomchip"></span></header>
<div id="app"></div>
<div id="hints"><span class="dot off" id="conn"></span><span><kbd>Space</kbd> next</span><span><kbd>F</kbd> fullscreen</span><span><kbd>T</kbd> day/night</span><span><kbd>M</kbd> mute</span></div>
<div id="dock">
  <button class="icon" id="theme" title="Day / night (T)"></button>
  <button class="icon" id="mute" title="Mute (M)"></button>
  <button class="icon" id="fs" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn hidden" id="next"></button>
</div>
<canvas id="confetti"></canvas>
<script src="/static/qrcode.js"></script>
<script src="/static/common.js"></script>
<script src="/static/sound.js"></script>
<script src="/static/host.js"></script>
</body>
</html>
