<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>Know Signal</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; font-size: 17px; -webkit-tap-highlight-color: transparent; }
  #app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .screen { flex: 1; display: flex; flex-direction: column; animation: fade .3s both; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; }
  h1, h2, p { margin: 0; }
  .muted { color: var(--muted); }

  .top { display: flex; justify-content: space-between; align-items: center; font-size: .86em; font-weight: 700; margin-bottom: 14px; gap: 10px; }
  .top .me { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .top .me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .logo { font-size: 15px; }
  .top .pts { background: var(--surface); border: 1px solid var(--line); padding: 5px 11px; border-radius: 99px; white-space: nowrap; }

  /* join */
  .join-hero .logo { font-size: 34px; }
  .tag { font-size: 1.05em; font-weight: 800; font-stretch: 112%; color: var(--muted); }
  form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  form .input { font-size: 1.25em; text-align: center; padding: 16px; font-weight: 700; border-radius: 16px; }
  form .btn { font-size: 1.15em; padding: 16px; border-radius: 16px; }
  .fine { font-size: .82em; color: var(--muted); }
  .err { color: var(--bad); font-weight: 700; }

  /* lobby */
  .you { font-size: 2.6em; }
  .nametag { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 800; font-size: 1.1em; }
  .bigbars { font-size: 64px; }

  /* ready + question */
  .qlabel { color: var(--pop); }
  .readynum { font-size: 120px; color: var(--pop); }
  .readynum span { display: inline-block; animation: slam .6s var(--spring) both; }
  .q { font-size: 1.32em; font-weight: 800; font-stretch: 104%; line-height: 1.28; margin: 2px 0 14px; }
  .tbar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 14px; }
  .tbar div { height: 100%; background: var(--brand); width: 100%; transform-origin: left; }
  .tbar.low div { background: var(--bad); }
  .choices { display: flex; flex-direction: column; gap: 11px; flex: 1; }
  .choice { background: var(--c); color: #fff; border-radius: 18px; padding: 14px 16px; text-align: left; font-size: 1.1em; font-weight: 800;
            display: flex; gap: 14px; align-items: center; min-height: 66px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); flex: 1; max-height: 150px;
            transition: transform .12s, opacity .25s, flex .35s var(--ease); animation: rise .4s var(--ease) both; }
  .choice .badge { font-size: 15px; }
  .choice:active { transform: scale(.97); }
  .choices.locked .choice { opacity: 0; flex: 0 0 0; min-height: 0; padding: 0 16px; overflow: hidden; pointer-events: none; }
  .choices.locked .choice.picked { opacity: 1; flex: 1; min-height: 66px; max-height: none; padding: 16px; flex-direction: column; justify-content: center; text-align: center; font-size: 1.3em; }
  .choices.locked .choice.picked .badge { font-size: 26px; }
  .lockmsg { text-align: center; font-weight: 800; font-stretch: 112%; margin-top: 12px; }

  /* result */
  .result { border-radius: 28px; padding: 30px 20px 26px; width: 100%; color: #fff; position: relative; overflow: hidden; animation: pop-in .45s var(--spring) both; }
  .result.good { background: var(--good); }
  .result.bad { background: var(--bad); animation: pop-in .45s both, shake .5s .45s; }
  .result.none { background: var(--surface-2); color: var(--text); }
  .result .big { font-size: 2.4em; }
  .result .pts { font-size: 1.6em; font-weight: 900; font-stretch: 125%; margin-top: 8px; }
  .result .sub { margin-top: 8px; opacity: .9; font-weight: 600; }
  .result .flash { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.22); font-size: .78em; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .stat { display: flex; gap: 12px; width: 100%; }
  .stat div { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
  .stat b { font-size: 1.9em; font-weight: 900; font-stretch: 125%; }
  .stat span { color: var(--muted); font-size: .82em; font-weight: 600; }
  .medal { font-size: 84px; line-height: 1; animation: pop-in .6s var(--spring) both; }

  #offline { position: fixed; top: 0; left: 0; right: 0; background: var(--bad); color: #fff; text-align: center; font-size: .82em; font-weight: 700; padding: 7px; z-index: 50; }
</style>
</head>
<body>
<div id="offline" class="hidden">Reconnecting to the room…</div>
<div id="app"></div>
<script src="/static/common.js"></script>
<script src="/static/play.js"></script>
</body>
</html>
